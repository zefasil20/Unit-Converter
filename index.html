<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="heading">
        <h2>Metric/Imperial Unit Conversion</h2>
        <input id="input-el">
        <button id="convert-el">Convert</button>
    </section>
    <div id="converted-unit">
        <div id="length-div" class="units-class">
            <h4 id="length-el">Length(Meter/Feet)</h4>
        </div>
        <div id="volume-div" class="units-class">
            <h4 id="volume-el">Volume(Liters/Gallons)</h4>
        </div>
        <div id="mass-div" class="units-class">
            <h4 id="mass-el">Mass(Kilograms/Pounds)</h4>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
